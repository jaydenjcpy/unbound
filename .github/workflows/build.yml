name: Build Unbound
run-name: >-
  ${{ inputs.version != '' && inputs.version || inputs.ipa_url != '' && inputs.ipa_url || 'latest stable' }}

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to the Discord IPA file"
        required: true
        type: string
      version:
        default: ""
        description: "Discord app version"
        required: false
        type: string
      release:
        default: true
        description: "Create a GitHub release"
        type: boolean
      add_extensions:
        default: true
        description: "Include extensions (OpenInDiscord & ShareToDiscord)"
        type: boolean
  workflow_call:
    inputs:
      ipa_url:
        default: ""
        type: string
      version:
        default: ""
        type: string
      release:
        default: true
        type: boolean
      add_extensions:
        default: true
        type: boolean
    outputs:
      deb_url:
        description: "Download URL for the deb package artifact"
        value: ${{ jobs.build-tweak.outputs.deb_url }}
      ipa_url:
        description: "Download URL for the ipa file artifact"
        value: ${{ jobs.build-ipa.outputs.ipa_url }}
      simulator_url:
        description: "Download URL for the iOS Simulator zip artifact"
        value: ${{ jobs.build-simulator.outputs.simulator_url }}
      deb_filename:
        description: "Filename of the deb package"
        value: ${{ jobs.build-tweak.outputs.deb_filename }}
      ipa_filename:
        description: "Filename of the ipa file"
        value: ${{ jobs.build-ipa.outputs.ipa_filename }}
      simulator_filename:
        description: "Filename of the iOS Simulator zip"
        value: ${{ jobs.build-simulator.outputs.simulator_filename }}

permissions: {}

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build-tweak:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      deb_url: ${{ steps.upload-deb.outputs.artifact-url }}
      deb_filename: ${{ steps.set-deb-filename.outputs.filename }}
    env:
      ATTESTATION_PK: ${{ secrets.ATTESTATION_PK }}

    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          cache: false
          go-version-file: go.mod

      - name: test tools
        run: go test ./...

      - name: check cache
        run: echo upstream_heads=`git ls-remote https://github.com/theos/theos | head -n 1 | cut -f 1`-`git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1` >> $GITHUB_ENV

      - name: use cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: trust Homebrew tap
        run: |
          if brew tap | grep -Fxq 'aws/tap'; then
            brew trust aws/tap
          fi

      - name: prepare Theos
        uses: Randomblock1/theos-action@4e23d15886bca77b5f7c462a82567e0de33ebe0b

      - name: build package
        run: go run ./tools build tweak --configuration release --non-interactive

      - name: upload rootless package
        id: upload-deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rootless package
          path: packages/*.deb

      - name: attest rootless package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: packages/*.deb

      - name: set deb filename
        id: set-deb-filename
        run: |
          DEB_FILE=$(ls packages/*.deb)
          DEB_FILENAME=$(basename "$DEB_FILE")
          echo "filename=$DEB_FILENAME" >> $GITHUB_OUTPUT

  build-ipa:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    needs: [build-tweak]
    outputs:
      ipa_url: ${{ steps.upload-ipa.outputs.artifact-url }}
      ipa_filename: ${{ steps.set-ipa-filename.outputs.filename }}

    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: select Xcode Version
        run: |
          set -euo pipefail
          selected_developer_dir=""
          for candidate in /Applications/Xcode_16.4.app /Applications/Xcode_16.4.0.app /Applications/Xcode.app; do
            if [ -x "$candidate/Contents/Developer/usr/bin/xcodebuild" ] && [ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | awk 'NR == 1 { print $2 }')" = "16.4" ]; then
              selected_developer_dir="$candidate/Contents/Developer"
              break
            fi
          done
          test -n "$selected_developer_dir"
          sudo xcode-select --switch "$selected_developer_dir"
          xcodebuild -version

      - name: download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          merge-multiple: true

      - name: download source ipa
        run: |
          set -euo pipefail
          IPA_URL="${{ inputs.ipa_url }}"
          if [ -z "$IPA_URL" ]; then
            echo "Error: ipa_url input is required"
            exit 1
          fi
          curl -fSL "$IPA_URL" -o discord.ipa

      - name: setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          cache: false
          go-version-file: go.mod

      - name: extract app name
        run: |
          NAME=$(grep '^Name:' control | cut -d ' ' -f 2)
          echo "APP_NAME=$NAME" >> $GITHUB_ENV

      - name: build IPA
        env:
          BUILD_EXTENSIONS: ${{ inputs.add_extensions == true && 'include' || 'exclude' }}
        run: |
          go run ./tools build ipa --ipa discord.ipa --deb "$(find . -maxdepth 1 -name '*.deb' -print -quit)" --channel appstore --extensions "$BUILD_EXTENSIONS" --output "${APP_NAME}.ipa" --non-interactive

      - name: upload ipa as artifact
        id: upload-ipa
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ipa
          path: ${{ env.APP_NAME }}.ipa

      - name: attest IPA
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ env.APP_NAME }}.ipa

      - name: set ipa filename
        id: set-ipa-filename
        run: echo "filename=${{ env.APP_NAME }}.ipa" >> $GITHUB_OUTPUT

  build-simulator:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    needs: build-ipa
    env:
      ATTESTATION_PK: ${{ secrets.ATTESTATION_PK }}
    outputs:
      simulator_url: ${{ steps.upload-simulator.outputs.artifact-url }}
      simulator_filename: ${{ steps.set-simulator-filename.outputs.filename }}

    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          cache: false
          go-version-file: go.mod

      - name: download ipa artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ipa

      - name: extract app name
        run: |
          NAME=$(grep '^Name:' control | cut -d ' ' -f 2)
          echo "APP_NAME=$NAME" >> $GITHUB_ENV

      - name: build simulator
        run: go run ./tools build simulator --ipa "${APP_NAME}.ipa" --output unbound-ios-simulator.zip --configuration release --non-interactive

      - name: upload iOS Simulator artifact
        id: upload-simulator
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-simulator
          path: unbound-ios-simulator.zip

      - name: attest iOS Simulator artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: unbound-ios-simulator.zip

      - name: set simulator filename
        id: set-simulator-filename
        run: echo "filename=unbound-ios-simulator.zip" >> $GITHUB_OUTPUT

  release-app:
    if: inputs.release == true
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    needs: [build-tweak, build-ipa, build-simulator]

    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          cache: false
          go-version-file: go.mod

      - name: download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          merge-multiple: true

      - name: extract Discord Version
        run: |
          IPA_FILE="${{ needs.build-ipa.outputs.ipa_filename }}"
          test -n "$IPA_FILE"
          test -f "$IPA_FILE"
          IPA_INFO=$(go run ./tools ipa-info --ipa "$IPA_FILE")
          VERSION=$(printf '%s\n' "$IPA_INFO" | jq -r '.version')
          echo "DISCORD_VERSION=$VERSION" >> $GITHUB_ENV

      - name: create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: v${{ env.DISCORD_VERSION }}
          files: |
            ${{ needs.build-tweak.outputs.deb_filename }}
            ${{ needs.build-simulator.outputs.simulator_filename }}
            ${{ needs.build-ipa.outputs.ipa_filename }}
          generate_release_notes: true
          prerelease: false
          fail_on_unmatched_files: true
          token: ${{ env.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
